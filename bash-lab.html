  :root {
    --bg:        #0b0f14;
    --panel:     #121a24;
    --panel-2:   #0e151d;
    --edge:      #243141;
    --ink:       #d7e0ea;
    --ink-dim:   #8a99a9;
    --term-ink:  #d7e0ea;
    --prompt:    #7fe0a8;
    --accent:    #43d2c9;
    --accent-2:  #6ab6ff;
    --warn:      #e8b964;
    --bad:       #ff8a7a;
    --good:      #7fe0a8;
    --mono: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, "Liberation Mono", monospace;
    --slab: "Roboto Slab", Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--slab);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  header.topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: linear-gradient(180deg, #121c27, #0d141c);
    border-bottom: 1px solid var(--edge);
    flex: 0 0 auto;
  }
  .topbar .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  .topbar h1 {
    font-size: 16px;
    letter-spacing: 0.04em;
    margin: 0;
    font-weight: 700;
  }
  .topbar .sub {
    color: var(--ink-dim);
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }
  .topbar .spacer { flex: 1; }
  .topbar button {
    font-family: var(--slab);
    font-size: 12.5px;
    color: var(--ink);
    background: #16212e;
    border: 1px solid var(--edge);
    border-radius: 7px;
    padding: 6px 11px;
    cursor: pointer;
  }
  .topbar button:hover { border-color: var(--accent); color: #fff; }

  main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 340px;
    min-height: 0;
  }

  /* Terminal pane */
  .term-wrap {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-right: 1px solid var(--edge);
    background: var(--panel-2);
  }
  #screen {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 16px 6px;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    color: var(--term-ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

        <kbd>Tab</kbd> completes &nbsp;·&nbsp; <kbd>↑</kbd><kbd>↓</kbd> history &nbsp;·&nbsp; type <code>help</code> anytime
      </footer>
    </aside>
  </main>

<script>
"use strict";
(function () {

  /* ============================================================
     FILE SYSTEM
     A node is either:
       { type:'dir',  name, children:{name:node}, perms, owner }
       { type:'file', name, content:string,        perms, owner }
     ============================================================ */

  const USER = "analyst";
  const HOST = "birchwood-01";

  function dir(name, children, perms) {
    return { type: "dir", name, children: children || {}, perms: perms || "drwxr-xr-x", owner: USER };
  }
  function file(name, content, perms) {
    return { type: "file", name, content: content, perms: perms || "-rw-r--r--", owner: USER };
  }

  // ---- scenario text --------------------------------------------------

  const README = `Welcome aboard, ${USER}.

You are the newest analyst on the security team at Birchwood Regional
Medical Center. We hold something attackers want badly: the private
medical records of everyone we treat. Keeping those records out of the
wrong hands is the whole job.

Last night an automated alert flagged something strange on one of our
web servers, "${HOST}". Look around, read the evidence, and work out
what happened -- and whether patient data was at risk.

You cannot break anything here that a "reset lab" will not fix, so
explore freely and try things.

Work through the CASE FILE on the right, top to bottom. When you get
stuck, remember that almost every command comes with a manual:

    man ls

Welcome to the team.
    -- J. Okafor, Security Lead`;

  const SECRET_TIP = `Rookie tip, just between us:

Most of the interesting evidence on a Linux server lives under /var/log.
A "log" is just a plain text file that a program adds a line to whenever
something happens -- a login, a web request, an error.

If you can read a text file, you can read a log.`;

  const NOTES = `(my scratch notes)
- auth.log = who logged in (or tried to)
- access.log = web requests to our site
- ask Okafor what "webadmin" account is for`;

  const MOTD = `  ==================================================
   BIRCHWOOD REGIONAL MEDICAL CENTER  //  SENTINEL WATCH
  ==================================================
  Authorized personnel only.
  Systems may contain protected health information (PHI).
  All access is logged and subject to HIPAA audit.`;

  const PASSWD = `root:x:0:0:root:/root:/bin/bash
daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
analyst:x:1000:1000:Security Analyst:/home/analyst:/bin/bash
webadmin:x:1001:1001:Web Admin (service acct):/home/webadmin:/bin/bash`;

  // auth.log: a brute-force pattern from one documentation-range IP,
  // then a successful login from that same IP (the break-in), plus
  // normal analyst activity from a different IP.
  const AUTH_LOG = `Oct 20 23:14:02 ${HOST} sshd[2041]: Accepted password for analyst from 198.51.100.4 port 51122 ssh2
Oct 20 23:51:47 ${HOST} sshd[2102]: Connection closed by 198.51.100.4
Oct 21 01:02:11 ${HOST} sshd[3307]: Failed password for invalid user admin from 203.0.113.77 port 40122 ssh2
Oct 21 01:02:13 ${HOST} sshd[3307]: Failed password for invalid user admin from 203.0.113.77 port 40124 ssh2
Oct 21 01:02:15 ${HOST} sshd[3309]: Failed password for invalid user root from 203.0.113.77 port 40130 ssh2
Oct 21 01:02:18 ${HOST} sshd[3311]: Failed password for invalid user oracle from 203.0.113.77 port 40140 ssh2
Oct 21 01:02:21 ${HOST} sshd[3313]: Failed password for invalid user test from 203.0.113.77 port 40151 ssh2
Oct 21 01:02:24 ${HOST} sshd[3315]: Failed password for invalid user postgres from 203.0.113.77 port 40162 ssh2
Oct 21 01:02:27 ${HOST} sshd[3317]: Failed password for webadmin from 203.0.113.77 port 40175 ssh2
Oct 21 01:02:30 ${HOST} sshd[3319]: Failed password for webadmin from 203.0.113.77 port 40188 ssh2
Oct 21 01:02:34 ${HOST} sshd[3321]: Failed password for webadmin from 203.0.113.77 port 40201 ssh2
Oct 21 01:02:38 ${HOST} sshd[3323]: Accepted password for webadmin from 203.0.113.77 port 40219 ssh2
Oct 21 01:03:05 ${HOST} sshd[3323]: pam_unix(sshd:session): session opened for user webadmin
Oct 21 06:30:09 ${HOST} sshd[5020]: Accepted password for analyst from 198.51.100.4 port 52001 ssh2`;

  const ACCESS_LOG = `198.51.100.4 - - [20/Oct/2026:22:10:01] "GET /index.html HTTP/1.1" 200 1843
203.0.113.77 - - [21/Oct/2026:01:04:52] "GET /login HTTP/1.1" 200 991
203.0.113.77 - - [21/Oct/2026:01:07:19] "POST /uploads/ HTTP/1.1" 201 55
203.0.113.77 - - [21/Oct/2026:01:07:20] "GET /uploads/invoice_build.php HTTP/1.1" 200 20
203.0.113.77 - - [21/Oct/2026:01:09:44] "GET /uploads/invoice_build.php?x=whoami HTTP/1.1" 200 9
198.51.100.4 - - [21/Oct/2026:08:15:03] "GET /index.html HTTP/1.1" 200 1843`;

  const SYSTEM_LOG = `Oct 21 01:05:30 ${HOST} systemd[1]: Started session-3323.scope.
Oct 21 01:07:19 ${HOST} kernel: new file created in /srv/www/uploads
Oct 21 03:00:01 ${HOST} CRON[6001]: (root) CMD (/usr/bin/backup.sh)`;

  const INDEX_HTML = `<!doctype html>
<html><head><title>Birchwood Regional Medical Center</title></head>
<body><h1>Birchwood Regional Medical Center</h1>
<p>Compassionate care for the Birchwood Valley.</p></body></html>`;

  // NOTE: intentionally inert. No working payload -- this is a label for
  // students to "find", not a real web shell.
  const SUSPICIOUS_PHP = `<?php
/* ---------------------------------------------------------------
   SIMULATED EVIDENCE -- not a real program.

   This file did NOT exist in the original website. It was uploaded
   from 203.0.113.77 at 01:07 on Oct 21 (see /var/log/access.log). A
   planted file like this can let an attacker run commands on the
   server -- and from a web server, try to reach the patient records.

   In a real investigation you would:
     - record the upload time and the source IP,
     - preserve a copy as evidence,
     - remove the file from the live server,
     - and reset the compromised account's password.

   The actual malicious contents have been left out of this
   training exercise on purpose.
--------------------------------------------------------------- */
?>`;

  function buildFS() {
    return dir("/", {
      "home": dir("home", {
        "analyst": dir("analyst", {
          "README.txt": file("README.txt", README),
          "notes.txt": file("notes.txt", NOTES),
          ".secret_tip.txt": file(".secret_tip.txt", SECRET_TIP),
          "reports": dir("reports", {})
        })
      }),
      "etc": dir("etc", {
        "motd": file("motd", MOTD),
        "hostname": file("hostname", HOST + "\n"),
        "passwd": file("passwd", PASSWD)
      }),
      "var": dir("var", {
        "log": dir("log", {
          "auth.log": file("auth.log", AUTH_LOG),
          "access.log": file("access.log", ACCESS_LOG),
          "system.log": file("system.log", SYSTEM_LOG)
        })
      }),
      "srv": dir("srv", {
        "www": dir("www", {
          "index.html": file("index.html", INDEX_HTML),
          "uploads": dir("uploads", {
            "invoice_build.php": file("invoice_build.php", SUSPICIOUS_PHP),
            "logo.png": file("logo.png", "\u0089PNG... (binary image data) ...")
          })
        })
      })
    });
  }

  const HOME = "/home/analyst";

  /* ============================================================
     STATE
     ============================================================ */

  let fs, cwd, history, histIdx, log, missionDone;
  let userOpen;   // UI: manual expand/collapse per step (once the student clicks a step header)

  function freshState() {
    fs = buildFS();
    cwd = HOME;
    history = [];
    histIdx = -1;
    log = [];              // {raw, argv, cwd, code, stdout}
    missionDone = {};      // id -> true
    userOpen = {};         // id -> true/false once the student clicks a step header
  }

  /* ============================================================
     PATH HELPERS
     ============================================================ */

  function splitPath(p) {
    return p.split("/").filter(function (s) { return s.length > 0; });
  }

  // Resolve a (possibly relative) path string to a normalized absolute path.
  function resolvePath(p) {
    if (p === undefined || p === "") p = ".";
    if (p[0] === "~") p = HOME + p.slice(1);
    let base = (p[0] === "/") ? [] : splitPath(cwd);
    const parts = splitPath(p);
    for (const part of parts) {
      if (part === ".") continue;
      else if (part === "..") base.pop();
      else base.push(part);
    }
    return "/" + base.join("/");
  }

  // Return node at absolute path, or null.
  function nodeAt(abs) {
    if (abs === "/") return fs;
    const parts = splitPath(abs);
    let cur = fs;
    for (const part of parts) {
      if (cur.type !== "dir" || !cur.children[part]) return null;
      cur = cur.children[part];
    }
    return cur;
  }

  function parentOf(abs) {
    const parts = splitPath(abs);
    const name = parts.pop();
    const parentAbs = "/" + parts.join("/");
    return { parent: nodeAt(parentAbs), name: name, parentAbs: parentAbs };
  }

  function displayCwd() {
    if (cwd === HOME) return "~";
    if (cwd.indexOf(HOME + "/") === 0) return "~" + cwd.slice(HOME.length);
    return cwd;
  }

  /* ============================================================
     OUTPUT HELPERS
     ============================================================ */

  const screen = document.getElementById("screen");

  function out(text, cls) {
    const div = document.createElement("div");
    div.className = "line" + (cls ? " " + cls : "");
    div.textContent = text;
    screen.appendChild(div);
  }
  function outHTML(html, cls) {
    const div = document.createElement("div");
    div.className = "line" + (cls ? " " + cls : "");
    div.innerHTML = html;
    screen.appendChild(div);
  }
  function scrollDown() { screen.scrollTop = screen.scrollHeight; }

  function escapeHTML(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ============================================================
     TOKENIZER / PARSER
     Handles: quotes, ~, $VARS, globbing, pipes, > >>
     ============================================================ */

  const ENV = { HOME: HOME, USER: USER, PWD: function () { return cwd; }, HOSTNAME: HOST };

  function tokenize(line) {
    const tokens = [];
    let i = 0, cur = "", inSingle = false, inDouble = false, hasContent = false;
    while (i < line.length) {
      const c = line[i];
      if (inSingle) {
        if (c === "'") inSingle = false;
        else cur += c;
      } else if (inDouble) {
        if (c === '"') inDouble = false;
        else cur += c;
      } else if (c === "'") { inSingle = true; hasContent = true; }
      else if (c === '"') { inDouble = true; hasContent = true; }
      else if (c === " " || c === "\t") {
        if (cur.length > 0 || hasContent) { tokens.push(cur); cur = ""; hasContent = false; }
      }
      else if (c === "|" || c === ">" ) {
        if (cur.length > 0 || hasContent) { tokens.push(cur); cur = ""; hasContent = false; }
        if (c === ">" && line[i + 1] === ">") { tokens.push(">>"); i++; }
        else tokens.push(c);
      }
      else cur += c;
      i++;
    }
    if (cur.length > 0 || hasContent) tokens.push(cur);
    return tokens;
  }

  // $VAR expansion on an unquoted-ish token (we approximate: expand always)
  function expandVars(tok) {
    return tok.replace(/\$(\w+)/g, function (m, name) {
      if (name in ENV) {
        const v = ENV[name];
        return (typeof v === "function") ? v() : v;
      }
      return "";
    });
  }

  // Glob a single token against the fs. Returns array of matches (or [tok] if none/no glob).
  function globToken(tok) {
    if (tok.indexOf("*") < 0 && tok.indexOf("?") < 0) return [tok];
    // split into dir part and pattern part
    let dirPart, pat;
    const slash = tok.lastIndexOf("/");
    if (slash >= 0) { dirPart = tok.slice(0, slash + 1); pat = tok.slice(slash + 1); }
    else { dirPart = ""; pat = tok; }
    const searchAbs = resolvePath(dirPart === "" ? "." : dirPart);
    const node = nodeAt(searchAbs);
    if (!node || node.type !== "dir") return [tok];
    const re = globToRegex(pat);
    const matches = [];
    Object.keys(node.children).sort().forEach(function (name) {
      if (name[0] === "." && pat[0] !== ".") return; // globs skip dotfiles
      if (re.test(name)) matches.push(dirPart + name);
    });
    return matches.length ? matches : [tok];
  }

  function globToRegex(pat) {
    let re = "^";
    for (const ch of pat) {
      if (ch === "*") re += ".*";
      else if (ch === "?") re += ".";
      else re += ch.replace(/[.+^${}()|[\]\\]/g, "\\$&");
    }
    return new RegExp(re + "$");
  }

  // Build a pipeline of stages. Each stage: {argv:[], redirect:{op,file}|null}
  function parse(line) {
    const raw = tokenize(line);
    const stages = [];
    let cur = { argv: [], redirect: null };
    for (let k = 0; k < raw.length; k++) {
      const t = raw[k];
      if (t === "|") { stages.push(cur); cur = { argv: [], redirect: null }; }
      else if (t === ">" || t === ">>") {
        const target = raw[k + 1];
        cur.redirect = { op: t, file: target };
        k++;
      } else {
        const expanded = expandVars(t);
        const globbed = globToken(expanded);
        for (const g of globbed) cur.argv.push(g);
      }
    }
    stages.push(cur);
    return stages;
  }

  /* ============================================================
     COMMAND IMPLEMENTATIONS
     Each returns { out:string, err:string, code:number }
     `stdin` is a string (from a pipe) or "".
     ============================================================ */

  function ok(s) { return { out: s === undefined ? "" : s, err: "", code: 0 }; }
  function fail(s) { return { out: "", err: s, code: 1 }; }

  // separate flags (-abc) from operands
  function splitArgs(argv) {
    const flags = {}, operands = [];
    for (let i = 1; i < argv.length; i++) {
      const a = argv[i];
      if (a.length > 1 && a[0] === "-" && a !== "-" && !/^-\d/.test(a)) {
        // keep long flags whole; split short combos
        if (a[1] === "-") flags[a.slice(2)] = true;
        else for (const ch of a.slice(1)) flags[ch] = true;
      } else operands.push(a);
    }
    return { flags, operands };
  }

  const COMMANDS = {

    help: function () {
      const names = Object.keys(COMMANDS).filter(function (n) { return !COMMANDS[n].hidden; }).sort();
      let s = "Commands you can use here:\n\n";
      const cols = 6;
      for (let i = 0; i < names.length; i += cols) {
        s += "  " + names.slice(i, i + cols).map(function (n) { return n.padEnd(9); }).join("") + "\n";
      }
      s += "\nType  man <command>  to read the manual for any of them.";
      s += "\nWork the CASE FILE on the right from the top down.";
      return ok(s);
    },

    pwd: function () { return ok(cwd); },

    whoami: function () { return ok(USER); },

    hostname: function () { return ok(HOST); },

    clear: function () { screen.innerHTML = ""; return ok(); },

    echo: function (argv) {
      // no var re-expansion here; already expanded in parse
      return ok(argv.slice(1).join(" "));
    },

    ls: function (argv) {
      const { flags, operands } = splitArgs(argv);
      const targets = operands.length ? operands : ["."];
      const showAll = flags["a"];
      const long = flags["l"];
      const chunks = [];
      let anyErr = "";
      const multiple = targets.length > 1;

      targets.forEach(function (t) {
        const abs = resolvePath(t);
        const node = nodeAt(abs);
        if (!node) { anyErr += "ls: cannot access '" + t + "': No such file or directory\n"; return; }
        let names;
        if (node.type === "file") {
          names = [{ name: t, node: node }];
        } else {
          names = Object.keys(node.children).sort().map(function (n) {
            return { name: n, node: node.children[n] };
          });
          if (showAll) {
            names = [{ name: ".", node: node }, { name: "..", node: node }].concat(names);
          } else {
            names = names.filter(function (e) { return e.name[0] !== "."; });
          }
        }
        let body;
        if (long) {
          body = names.map(function (e) {
            const nd = e.node;
            const size = nd.type === "file" ? String(nd.content.length) : "4096";
            return nd.perms + "  1 " + USER.padEnd(8) + " " +
                   size.padStart(5) + "  " + e.name;
          }).join("\n");
        } else {
          body = names.map(function (e) {
            return e.node.type === "dir" ? e.name + "/" : e.name;
          }).join("  ");
        }
        if (multiple && node.type === "dir") chunks.push(t + ":\n" + body);
        else chunks.push(body);
      });
      const outp = chunks.join("\n\n");
      if (anyErr && !outp) return { out: "", err: anyErr.trim(), code: 1 };
      return { out: outp, err: anyErr.trim(), code: anyErr ? 1 : 0 };
    },

    cd: function (argv) {
      const { operands } = splitArgs(argv);
      let target = operands[0];
      if (target === undefined || target === "~") target = HOME;
      if (target === "-") target = HOME; // simplification
      const abs = resolvePath(target);
      const node = nodeAt(abs);
      if (!node) return fail("cd: " + target + ": No such file or directory");
      if (node.type !== "dir") return fail("cd: " + target + ": Not a directory");
      cwd = abs;
      ENV.PWD = cwd;
      return ok();
    },

    cat: function (argv, stdin) {
      const { operands } = splitArgs(argv);
      if (operands.length === 0) return ok(stdin);
      let out = "", err = "";
      operands.forEach(function (t) {
        const node = nodeAt(resolvePath(t));
        if (!node) err += "cat: " + t + ": No such file or directory\n";
        else if (node.type === "dir") err += "cat: " + t + ": Is a directory\n";
        else out += node.content + (node.content.endsWith("\n") ? "" : "\n");
      });
      if (out.endsWith("\n")) out = out.slice(0, -1);
      return { out: out, err: err.trim(), code: err ? 1 : 0 };
    },

    head: function (argv, stdin) {
      const { flags, operands } = splitArgs(argv);
      let n = 10;
      // support -n N  and  -N
      for (let i = 1; i < argv.length; i++) {
        if (argv[i] === "-n" && argv[i + 1]) { n = parseInt(argv[i + 1], 10); }
        else if (/^-\d+$/.test(argv[i])) { n = parseInt(argv[i].slice(1), 10); }
      }
      const realOps = operands.filter(function (o) { return !/^\d+$/.test(o); });
      const text = realOps.length ? readOrErr(realOps[0]) : { out: stdin, err: "" };
      if (text.err) return fail(text.err);
      return ok(text.out.split("\n").slice(0, n).join("\n"));
    },

    tail: function (argv, stdin) {
      const { operands } = splitArgs(argv);
      let n = 10;
      for (let i = 1; i < argv.length; i++) {
        if (argv[i] === "-n" && argv[i + 1]) { n = parseInt(argv[i + 1], 10); }
        else if (/^-\d+$/.test(argv[i])) { n = parseInt(argv[i].slice(1), 10); }
      }
      const realOps = operands.filter(function (o) { return !/^\d+$/.test(o); });
      const text = realOps.length ? readOrErr(realOps[0]) : { out: stdin, err: "" };
      if (text.err) return fail(text.err);
      const lines = text.out.split("\n");
      return ok(lines.slice(Math.max(0, lines.length - n)).join("\n"));
    },

    wc: function (argv, stdin) {
      const { flags, operands } = splitArgs(argv);
      let text, label = "";
      if (operands.length) {
        const r = readOrErr(operands[0]);
        if (r.err) return fail(r.err);
        text = r.out; label = " " + operands[0];
      } else text = stdin;
      const lines = text === "" ? 0 : text.replace(/\n$/, "").split("\n").length;
      const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
      const chars = text.length;
      if (flags["l"]) return ok(String(lines) + label);
      if (flags["w"]) return ok(String(words) + label);
      if (flags["c"]) return ok(String(chars) + label);
      return ok("  " + lines + "  " + words + "  " + chars + label);
    },

    grep: function (argv, stdin) {
      const { flags, operands } = splitArgs(argv);
      if (operands.length === 0) return fail("usage: grep [-i] [-n] [-v] [-c] PATTERN [FILE]");
      const pat = operands[0];
      const files = operands.slice(1);
      let re;
      try { re = new RegExp(pat, flags["i"] ? "i" : ""); }
      catch (e) { re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), flags["i"] ? "i" : ""); }

      function run(text, prefix) {
        const lines = text.split("\n");
        const matched = [];
        lines.forEach(function (ln, idx) {
          let hit = re.test(ln);
          if (flags["v"]) hit = !hit;
          if (hit) {
            let o = ln;
            if (flags["n"]) o = (idx + 1) + ":" + o;
            if (prefix) o = prefix + ":" + o;
            matched.push(o);
          }
        });
        return matched;
      }

      let results = [], err = "";
      if (files.length === 0) {
        results = run(stdin, "");
      } else {
        files.forEach(function (f) {
          const r = readOrErr(f);
          if (r.err) { err += "grep: " + f + ": No such file or directory\n"; return; }
          results = results.concat(run(r.out, files.length > 1 ? f : ""));
        });
      }
      if (flags["c"]) return { out: String(results.length), err: err.trim(), code: err ? 2 : 0 };
      return { out: results.join("\n"), err: err.trim(), code: (results.length ? 0 : 1) };
    },

    find: function (argv) {
      const { operands } = splitArgs(argv);
      let start = ".", namePat = null, typeFilter = null;
      const rest = [];
      for (let i = 1; i < argv.length; i++) {
        if (argv[i] === "-name") { namePat = argv[++i]; }
        else if (argv[i] === "-type") { typeFilter = argv[++i]; }
        else if (argv[i][0] !== "-") rest.push(argv[i]);
      }
      if (rest.length) start = rest[0];
      const startAbs = resolvePath(start);
      const startNode = nodeAt(startAbs);
      if (!startNode) return fail("find: '" + start + "': No such file or directory");
      const re = namePat ? globToRegex(namePat) : null;
      const found = [];
      (function walk(node, path) {
        const isDir = node.type === "dir";
        const nameOnly = path === "/" ? "/" : path.split("/").pop();
        let typeOk = true;
        if (typeFilter === "f") typeOk = !isDir;
        if (typeFilter === "d") typeOk = isDir;
        const nameOk = re ? re.test(nameOnly) : true;
        if (typeOk && nameOk) found.push(path);
        if (isDir) {
          Object.keys(node.children).sort().forEach(function (c) {
            walk(node.children[c], path === "/" ? "/" + c : path + "/" + c);
          });
        }
      })(startNode, startAbs === "/" ? "/" : (start === "." ? "." : startAbs));
      // normalize "." root display
      return ok(found.join("\n"));
    },

    mkdir: function (argv) {
      const { flags, operands } = splitArgs(argv);
      if (!operands.length) return fail("mkdir: missing operand");
      let err = "";
      operands.forEach(function (t) {
        const abs = resolvePath(t);
        const { parent, name } = parentOf(abs);
        if (!parent && !flags["p"]) { err += "mkdir: cannot create '" + t + "': No such file or directory\n"; return; }
        if (parent && parent.type === "dir") {
          if (parent.children[name]) { if (!flags["p"]) err += "mkdir: cannot create directory '" + t + "': File exists\n"; }
          else parent.children[name] = dir(name, {});
        } else if (flags["p"]) {
          // create chain
          const parts = splitPath(abs);
          let cur = fs;
          parts.forEach(function (p) {
            if (!cur.children[p]) cur.children[p] = dir(p, {});
            cur = cur.children[p];
          });
        } else err += "mkdir: cannot create '" + t + "'\n";
      });
      return err ? { out: "", err: err.trim(), code: 1 } : ok();
    },

    touch: function (argv) {
      const { operands } = splitArgs(argv);
      if (!operands.length) return fail("touch: missing file operand");
      let err = "";
      operands.forEach(function (t) {
        const abs = resolvePath(t);
        const node = nodeAt(abs);
        if (node) return; // exists
        const { parent, name } = parentOf(abs);
        if (!parent || parent.type !== "dir") { err += "touch: cannot touch '" + t + "': No such file or directory\n"; return; }
        parent.children[name] = file(name, "");
      });
      return err ? { out: "", err: err.trim(), code: 1 } : ok();
    },

    rm: function (argv) {
      const { flags, operands } = splitArgs(argv);
      if (!operands.length) return fail("rm: missing operand");
      let err = "";
      operands.forEach(function (t) {
        const abs = resolvePath(t);
        const node = nodeAt(abs);
        if (!node) { err += "rm: cannot remove '" + t + "': No such file or directory\n"; return; }
        if (node.type === "dir" && !flags["r"] && !flags["R"]) { err += "rm: cannot remove '" + t + "': Is a directory\n"; return; }
        const { parent, name } = parentOf(abs);
        if (parent && parent.children[name]) delete parent.children[name];
      });
      return err ? { out: "", err: err.trim(), code: 1 } : ok();
    },

    cp: function (argv) {
      const { flags, operands } = splitArgs(argv);
      if (operands.length < 2) return fail("cp: missing destination file operand");
      const srcNode = nodeAt(resolvePath(operands[0]));
      if (!srcNode) return fail("cp: cannot stat '" + operands[0] + "': No such file or directory");
      if (srcNode.type === "dir" && !flags["r"]) return fail("cp: -r not specified; omitting directory '" + operands[0] + "'");
      return placeCopy(srcNode, operands[1], "cp");
    },

    mv: function (argv) {
      const { operands } = splitArgs(argv);
      if (operands.length < 2) return fail("mv: missing destination file operand");
      const srcAbs = resolvePath(operands[0]);
      const srcNode = nodeAt(srcAbs);
      if (!srcNode) return fail("mv: cannot stat '" + operands[0] + "': No such file or directory");
      const res = placeCopy(srcNode, operands[1], "mv");
      if (res.code === 0) {
        const { parent, name } = parentOf(srcAbs);
        if (parent && parent.children[name]) delete parent.children[name];
      }
      return res;
    },

    sort: function (argv, stdin) {
      const { flags, operands } = splitArgs(argv);
      let text;
      if (operands.length) { const r = readOrErr(operands[0]); if (r.err) return fail(r.err); text = r.out; }
      else text = stdin;
      let lines = text.replace(/\n$/, "").split("\n");
      lines.sort();
      if (flags["r"]) lines.reverse();
      return ok(lines.join("\n"));
    },

    uniq: function (argv, stdin) {
      const { flags, operands } = splitArgs(argv);
      let text;
      if (operands.length) { const r = readOrErr(operands[0]); if (r.err) return fail(r.err); text = r.out; }
      else text = stdin;
      const lines = text.replace(/\n$/, "").split("\n");
      const res = [];
      let prev = null, count = 0;
      lines.forEach(function (ln) {
        if (ln === prev) count++;
        else {
          if (prev !== null) res.push(flags["c"] ? String(count).padStart(7) + " " + prev : prev);
          prev = ln; count = 1;
        }
      });
      if (prev !== null) res.push(flags["c"] ? String(count).padStart(7) + " " + prev : prev);
      return ok(res.join("\n"));
    },

    tree: function (argv) {
      const { operands } = splitArgs(argv);
      const start = operands[0] || ".";
      const node = nodeAt(resolvePath(start));
      if (!node) return fail("tree: " + start + ": No such file or directory");
      const lines = [start];
      (function walk(n, prefix) {
        if (n.type !== "dir") return;
        const keys = Object.keys(n.children).filter(function (k) { return k[0] !== "."; }).sort();
        keys.forEach(function (k, idx) {
          const last = idx === keys.length - 1;
          const child = n.children[k];
          lines.push(prefix + (last ? "└── " : "├── ") + k + (child.type === "dir" ? "/" : ""));
          if (child.type === "dir") walk(child, prefix + (last ? "    " : "│   "));
        });
      })(node, "");
      return ok(lines.join("\n"));
    },

    history: function () {
      return ok(history.map(function (h, i) { return String(i + 1).padStart(4) + "  " + h; }).join("\n"));
    },

    date: function () {
      return ok(new Date().toString());
    },

    man: function (argv) {
      const { operands } = splitArgs(argv);
      if (!operands.length) return fail("What manual page do you want?\nFor example, try: man ls");
      const page = MAN[operands[0]];
      if (!page) return fail("No manual entry for " + operands[0]);
      return ok(page);
    }
  };

  COMMANDS.hostname.hidden = true;
  COMMANDS.date.hidden = true;

  // helper: read a file to {out,err}
  function readOrErr(t) {
    const node = nodeAt(resolvePath(t));
    if (!node) return { out: "", err: t + ": No such file or directory" };
    if (node.type === "dir") return { out: "", err: t + ": Is a directory" };
    return { out: node.content, err: "" };
  }

  // helper: copy a node to a destination path (used by cp/mv)
  function placeCopy(srcNode, destArg, cmd) {
    const destAbs = resolvePath(destArg);
    const destNode = nodeAt(destAbs);
    function clone(n, newName) {
      if (n.type === "file") return file(newName, n.content, n.perms);
      const d = dir(newName, {}, n.perms);
      Object.keys(n.children).forEach(function (k) { d.children[k] = clone(n.children[k], k); });
      return d;
    }
    if (destNode && destNode.type === "dir") {
      destNode.children[srcNode.name] = clone(srcNode, srcNode.name);
      return ok();
    }
    const { parent, name } = parentOf(destAbs);
    if (!parent || parent.type !== "dir") return fail(cmd + ": cannot create '" + destArg + "': No such file or directory");
    parent.children[name] = clone(srcNode, name);
    return ok();
  }

     EXECUTION
     ============================================================ */

  function runPipeline(line) {
    const stages = parse(line);
    let stdin = "";
    let last = { out: "", err: "", code: 0 };
    for (let s = 0; s < stages.length; s++) {
      const stage = stages[s];
      const argv = stage.argv;
      if (argv.length === 0 || argv[0] === "") { last = { out: "", err: "", code: 0 }; stdin = ""; continue; }
      const name = argv[0];
      const cmd = COMMANDS[name];
      if (!cmd) {
        last = { out: "", err: name + ": command not found", code: 127 };
        stdin = "";
        if (stage.redirect) { /* nothing to write */ }
        continue;
      }
      last = cmd(argv, stdin) || { out: "", err: "", code: 0 };
      // redirection (applies to this stage's stdout)
      if (stage.redirect && stage.redirect.file) {
        const abs = resolvePath(stage.redirect.file);
        const { parent, name: fname } = parentOf(abs);
        if (!parent || parent.type !== "dir") {
          last = { out: "", err: name + ": " + stage.redirect.file + ": No such file or directory", code: 1 };
        } else {
          const existing = parent.children[fname];
          const payload = last.out + (last.out.endsWith("\n") || last.out === "" ? "" : "\n");
          if (stage.redirect.op === ">>" && existing && existing.type === "file") existing.content += payload;
          else parent.children[fname] = file(fname, payload);
          last = { out: "", err: last.err, code: last.code };
        }
        stdin = "";
      } else {
        stdin = last.out;
      }
    }
    return last;
  }

  function promptHTML() {
    return '<span class="prompt">' + USER + "@" + HOST +
      ':<span class="path">' + escapeHTML(displayCwd()) + '</span>$ </span>';
  }

  function execute(line) {
    // echo the prompt + command
    outHTML(promptHTML() + '<span class="cmd-echo">' + escapeHTML(line) + "</span>");

    const trimmed = line.trim();
    if (trimmed !== "") { history.push(line); }
    histIdx = history.length;

    if (trimmed === "") { scrollDown(); return; }

    const wasClear = trimmed === "clear" || trimmed.indexOf("clear") === 0;
    const result = runPipeline(trimmed);

    if (!wasClear) {
      if (result.out) out(result.out);
      if (result.err) out(result.err, "err");
    }

    // record to log for mission checks
    const firstArgv = parse(trimmed)[0].argv;
    log.push({ raw: trimmed, argv: firstArgv, cwd: cwd, code: result.code, out: result.out });

    checkMissions();
    save();
    scrollDown();
  }

     MISSIONS
     ============================================================ */

  // Each check receives helpers over the command log.
  function ranCmd(name) { return log.some(function (e) { return e.argv[0] === name; }); }
  function ranWhere(pred) { return log.some(pred); }
  function lastOutOf(name) {
    for (let i = log.length - 1; i >= 0; i--) if (log[i].argv[0] === name) return log[i].out;
    return null;
  }

      id: "look",
      title: "Look around",
      body: "See what is in your home directory, then read the welcome note the security lead left you.\n\n  • list the files  →  <code>ls</code>\n  • read the note  →  <code>cat README.txt</code>",
      hint: "Run ls to see the file names. One of them is README.txt — read it with: cat README.txt",
      check: function () { return ranCmd("ls") && ranWhere(function (e) { return e.argv[0] === "cat" && /readme/i.test(e.raw); }); }
    },
    {
      id: "hidden",
      title: "Find what is hidden",
      body: "Some files are hidden: their names start with a dot, and a plain <code>ls</code> will not show them. There is a hidden tip in your home folder.\n\n  • show hidden files  →  <code>ls -a</code>\n  • read the hidden tip (its name starts with a dot)",
      hint: "ls -a reveals names like .secret_tip.txt — then: cat .secret_tip.txt",
      check: function () { return ranWhere(function (e) { return e.argv[0] === "cat" && /secret_tip/i.test(e.raw); }); }
    },
    {
      id: "travel",
      title: "Follow the lead",
      body: "The tip pointed you to where the logs live: <code>/var/log</code>. Travel there and see what is waiting.\n\n  • change directory  →  <code>cd /var/log</code>\n  • list what is there  →  <code>ls</code>\n\nConfirm with <code>pwd</code> that you arrived.",
      hint: "cd /var/log moves you there. Run ls to see auth.log, access.log, system.log.",
      check: function () { return ranWhere(function (e) { return e.argv[0] === "ls" && e.cwd === "/var/log"; }); }
    },
    {
      id: "read-log",
      title: "Read the security log",
      body: "<code>auth.log</code> records every login and every failed attempt. Open it and read what happened overnight.\n\n  • read it  →  <code>cat auth.log</code>\n\nToo long to take in? Peek at just the start with <code>head auth.log</code>.",
      hint: "From /var/log, run: cat auth.log  — look for lines that say Failed and Accepted.",
      check: function () { return ranWhere(function (e) { return (e.argv[0] === "cat" || e.argv[0] === "head" || e.argv[0] === "tail") && /auth\.log/.test(e.raw); }); }
    },
    {
      id: "manual",
      title: "Learn a new tool",
      body: "To search inside that log you need <code>grep</code>. You have not used it yet, so read its manual first.\n\n  • open the manual  →  <code>man grep</code>",
      hint: "Type: man grep  — read how -c (count) and -i (ignore case) work. You will use them next.",
      check: function () { return ranWhere(function (e) { return e.argv[0] === "man" && e.argv[1] === "grep"; }); }
    },
    {
      id: "hunt-fails",
      title: "Count the failed break-ins",
      body: "Someone hammered the server with wrong passwords. Use <code>grep</code> to pull out only those lines.\n\n  • find them  →  <code>grep \"Failed password\" auth.log</code>\n  • count them  →  add <code>-c</code>, or pipe into <code>wc -l</code>\n\nHow many failures were there, and what IP address did they come from?",
      hint: "grep \"Failed password\" auth.log shows the lines. grep -c \"Failed password\" auth.log counts them. They all come from one IP.",
      check: function () { return ranWhere(function (e) { return e.argv[0] === "grep" && /failed/i.test(e.raw) && /auth\.log/.test(e.raw); }); }
    },
    {
      id: "the-breach",
      title: "Find the one that worked",
      body: "Failed attempts are noise. The real question: did any attempt from that attacker SUCCEED? Successful logins say <code>Accepted</code>.\n\n  • search  →  <code>grep Accepted auth.log</code>\n\nOne accepted login shares the attacker's IP (203.0.113.77). Which account did they get into?",
      hint: "grep Accepted auth.log — then look for the line whose IP is 203.0.113.77. The account name is right before \"from\".",
      check: function () { return ranWhere(function (e) { return e.argv[0] === "grep" && /accepted/i.test(e.raw) && /auth\.log/.test(e.raw); }); }
    },
    {
      id: "locate-file",
      title: "Hunt the planted file",
      body: "After breaking in, the attacker uploaded a file to the website under <code>/srv/www</code>. You do not know its name, only that it is a <code>.php</code> file. Use <code>find</code>.\n\n  • search for it  →  <code>find /srv -name \"*.php\"</code>\n\nThen read the file it points to.",
      hint: 'find /srv -name "*.php" prints the full path. Then cat that path to read it.',
      check: function () { return ranWhere(function (e) { return e.argv[0] === "find" && /\.php/.test(e.raw); }); }
    },
    {
      id: "report",
      title: "Write up the case",
      body: "You have enough to report. Save a short finding to a file in your reports folder.\n\n  • go home  →  <code>cd ~</code>\n  • write it  →  <code>echo \"webadmin breached from 203.0.113.77\" > reports/findings.txt</code>\n\nThen confirm with <code>cat reports/findings.txt</code>. Case closed.",
      hint: 'Use > to send echo into a file: echo \"...your finding...\" > reports/findings.txt — any text works.',
      check: function () {
        const node = nodeAt("/home/analyst/reports/findings.txt");
        return !!(node && node.type === "file" && node.content.trim().length > 0);
      }
    }
  ];

  const mListEl = document.getElementById("m-list");
  const progressBar = document.getElementById("progress-bar");

  function renderMissions() {
    mListEl.innerHTML = "";
    let firstIncomplete = MISSIONS.findIndex(function (m) { return !missionDone[m.id]; });
    const allDone = firstIncomplete === -1;

    MISSIONS.forEach(function (m, idx) {
      const done = !!missionDone[m.id];
      const active = !done && idx === firstIncomplete;
      const reviewable = done || active;           // completed or current -> instructions can be opened
      // default: only the current step is open; completed steps collapse (one click reopens them)
      const defaultOpen = active;
      const open = reviewable &&
        (Object.prototype.hasOwnProperty.call(userOpen, m.id) ? userOpen[m.id] : defaultOpen);

      const item = document.createElement("div");
      item.className = "m-item" + (done ? " done" : "") + (active ? " active" : "") +
        (reviewable ? " reviewable" : " locked") + (open ? " open" : "");

      const top = document.createElement("div");
      top.className = "m-top";
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = done ? "✓" : String(idx + 1);
      top.appendChild(badge);
      const t = document.createElement("span");
      t.textContent = m.title;
      top.appendChild(t);

      if (reviewable) {
        const chev = document.createElement("span");
        chev.className = "chev";
        chev.textContent = "▸";   // right-pointing triangle; rotates down when open
        top.appendChild(chev);
        top.addEventListener("click", function () {
          const cur = Object.prototype.hasOwnProperty.call(userOpen, m.id)
            ? userOpen[m.id] : defaultOpen;
          userOpen[m.id] = !cur;
          renderMissions();
        });
      }
      item.appendChild(top);

      if (reviewable) {
        const body = document.createElement("div");
        body.className = "m-body";
        body.innerHTML = m.body;
        item.appendChild(body);

        if (active) {
          const hint = document.createElement("div");
          hint.className = "hint";
          hint.innerHTML = 'Need a nudge? <span class="muted">(tap)</span><div class="hint-text">' + escapeHTML(m.hint) + "</div>";
          hint.addEventListener("click", function (e) { e.stopPropagation(); hint.classList.toggle("hintopen"); });
          item.appendChild(hint);
        }
      }

      mListEl.appendChild(item);
    });

    if (allDone) {
      const done = document.createElement("div");
      done.className = "m-done-all";
      done.innerHTML = '<div class="big">✓ Case closed</div><div class="muted" style="margin-top:6px">' +
        'You traced a break-in from first failed login to the file left behind. ' +
        'Type <code style="color:var(--accent)">help</code> to keep exploring, or hit "reset lab" to run it again.</div>';
      mListEl.appendChild(done);
    }

    const doneCount = MISSIONS.filter(function (m) { return missionDone[m.id]; }).length;
    progressBar.style.width = Math.round((doneCount / MISSIONS.length) * 100) + "%";
  }

  function checkMissions() {
    let changed = false;
    MISSIONS.forEach(function (m) {
      if (!missionDone[m.id]) {
        let passed = false;
        try { passed = m.check(); } catch (e) { passed = false; }
        if (passed) {
          missionDone[m.id] = true;
          changed = true;
          outHTML('<span class="mission-pop">✓ Mission complete: ' + escapeHTML(m.title) + "</span>");
        }
      }
    });
    if (changed) renderMissions();
  }

  /* ============================================================
     PERSISTENCE  (best-effort; wrapped)
     ============================================================ */

  const STORE_KEY = "birchwood_sentinel_v1";

  function save() {
    try {
      const data = JSON.stringify({ fs: fs, cwd: cwd, history: history, log: log, missionDone: missionDone });
      localStorage.setItem(STORE_KEY, data);
    } catch (e) { /* private mode / disabled — ignore */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || !data.fs) return false;
      fs = data.fs; cwd = data.cwd || HOME;
      history = data.history || []; log = data.log || [];
      missionDone = data.missionDone || {};
      histIdx = history.length;
      ENV.PWD = cwd;
      return true;
    } catch (e) { return false; }
  }

  function resetLab() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    freshState();
    screen.innerHTML = "";
    renderMissions();
    boot(true);
  }

  /* ============================================================
     INPUT HANDLING
     ============================================================ */

  const input = document.getElementById("cmdline");
  const promptSpan = document.getElementById("prompt-span");

  function refreshPrompt() {
    promptSpan.innerHTML = USER + "@" + HOST + ':<span class="path">' + escapeHTML(displayCwd()) + "</span>$";
  }

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      const line = input.value;
      input.value = "";
      execute(line);
      refreshPrompt();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (history.length === 0) return;
      histIdx = Math.max(0, histIdx - 1);
      input.value = history[histIdx] || "";
      moveCaretEnd();
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (history.length === 0) return;
      histIdx = Math.min(history.length, histIdx + 1);
      input.value = histIdx === history.length ? "" : history[histIdx];
      moveCaretEnd();
    } else if (e.key === "Tab") {
      e.preventDefault();
      autocomplete();
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault();
      screen.innerHTML = "";
    }
  });

  function moveCaretEnd() {
    setTimeout(function () { input.selectionStart = input.selectionEnd = input.value.length; }, 0);
  }

  function autocomplete() {
    const val = input.value;
    const parts = val.split(/\s+/);
    const editing = parts[parts.length - 1];

    // first word → complete command name
    if (parts.length === 1) {
      const cands = Object.keys(COMMANDS).filter(function (n) { return !COMMANDS[n].hidden && n.indexOf(editing) === 0; });
      applyCompletion(val, editing, cands);
      return;
    }
    // otherwise → complete a path
    let dirPart, frag;
    const slash = editing.lastIndexOf("/");
    if (slash >= 0) { dirPart = editing.slice(0, slash + 1); frag = editing.slice(slash + 1); }
    else { dirPart = ""; frag = editing; }
    const node = nodeAt(resolvePath(dirPart === "" ? "." : dirPart));
    if (!node || node.type !== "dir") return;
    const cands = Object.keys(node.children).filter(function (n) {
      if (frag[0] !== "." && n[0] === ".") return false;
      return n.indexOf(frag) === 0;
    }).map(function (n) {
      return dirPart + n + (node.children[n].type === "dir" ? "/" : "");
    });
    applyCompletion(val, editing, cands, true);
  }

  function applyCompletion(val, editing, cands, isPath) {
    if (cands.length === 0) return;
    if (cands.length === 1) {
      const completed = cands[0];
      const base = val.slice(0, val.length - editing.length);
      input.value = base + completed + (isPath && completed.endsWith("/") ? "" : (isPath ? "" : " "));
      moveCaretEnd();
    } else {
      // common prefix
      let prefix = cands[0];
      cands.forEach(function (c) { while (c.indexOf(prefix) !== 0) prefix = prefix.slice(0, -1); });
      const base = val.slice(0, val.length - editing.length);
      if (prefix.length > editing.length) { input.value = base + prefix; moveCaretEnd(); }
      outHTML(promptHTML() + '<span class="cmd-echo">' + escapeHTML(val) + "</span>");
      out(cands.join("  "), "muted");
      scrollDown();
    }
  }

  // keep focus on the input when clicking the terminal
  document.querySelector(".term-wrap").addEventListener("mousedown", function (e) {
    if (window.getSelection().toString()) return; // allow text selection
    setTimeout(function () { input.focus(); }, 0);
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    if (confirm("Reset the lab? This clears your files and mission progress and starts the case over.")) {
      resetLab();
    }
  });
  document.getElementById("btn-help").addEventListener("click", function () {
    execute("help");
    refreshPrompt();
    input.focus();
  });

  /* ============================================================
     BOOT
     ============================================================ */

  function boot(isReset) {
    outHTML('<span class="banner">' + escapeHTML(MOTD) + "</span>");
    out("");
    outHTML('<span class="muted">Connected to ' + HOST + ' as ' + USER +
      '.  Type </span><span class="ok">help</span><span class="muted"> to begin, or follow the CASE FILE on the right.</span>');
    out("");
    refreshPrompt();
    scrollDown();
    input.focus();
  }

  // init
  freshState();
  const restored = load();
  renderMissions();
  if (restored) {
    outHTML('<span class="muted">Welcome back. Your previous session was restored — your files and progress are where you left them.</span>');
    outHTML('<span class="muted">(Use "reset lab" to start the case over.)</span>');
    out("");
    refreshPrompt();
    scrollDown();
    input.focus();
  } else {
    boot(false);
  }

})();
</script>
</body>
