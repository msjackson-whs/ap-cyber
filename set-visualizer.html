<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Java Set Visualizer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: controls on top, the set as a soft bubble on the left, call log on the right; one column on narrow screens */
  :root {
    --bg: #f6f6f3;
    --panel: #ffffff;
    --border: #d9d8d1;
    --border-strong: #b5b3a8;
    --text: #22221f;
    --text-2: #5b5a53;
    --muted: #96948a;
    --accent: #185fa5;
    --accent-bg: #e3effa;
    --add: #1d7a4f;
    --add-bg: #e2f4ea;
    --remove: #9a5a08;
    --remove-bg: #fbeedb;
    --peek: #534ab7;
    --peek-bg: #edecfd;
    --danger: #a32d2d;
    --danger-bg: #fcebeb;
    --bubble-a: rgba(83, 74, 183, 0.10);
    --bubble-b: rgba(24, 95, 165, 0.07);
    --bubble-edge: rgba(83, 74, 183, 0.28);
    --orb: #ffffff;
    --on-fill: #ffffff;
    --btn-edge: rgba(0, 0, 0, 0.22);
    --btn-shadow: rgba(0, 0, 0, 0.10);
    --font-sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --panel: #212226; --border: #34363b; --border-strong: #4a4c53;
      --text: #ecebe6; --text-2: #b4b2aa; --muted: #7d7b74;
      --accent: #7db6ec; --accent-bg: #1c3045;
      --add: #6fd2a0; --add-bg: #183528; --remove: #f0b45e; --remove-bg: #3a2a12;
      --peek: #aea7f5; --peek-bg: #2a2748; --danger: #f08b8b; --danger-bg: #3d1c1c;
      --bubble-a: rgba(174, 167, 245, 0.12); --bubble-b: rgba(125, 182, 236, 0.07); --bubble-edge: rgba(174, 167, 245, 0.30);
      --orb: #2a2b30;
      --on-fill: #15161a; --btn-edge: rgba(0, 0, 0, 0.55); --btn-shadow: rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --panel: #212226; --border: #34363b; --border-strong: #4a4c53;
    --text: #ecebe6; --text-2: #b4b2aa; --muted: #7d7b74;
    --accent: #7db6ec; --accent-bg: #1c3045;
    --add: #6fd2a0; --add-bg: #183528; --remove: #f0b45e; --remove-bg: #3a2a12;
    --peek: #aea7f5; --peek-bg: #2a2748; --danger: #f08b8b; --danger-bg: #3d1c1c;
    --bubble-a: rgba(174, 167, 245, 0.12); --bubble-b: rgba(125, 182, 236, 0.07); --bubble-edge: rgba(174, 167, 245, 0.30);
    --orb: #2a2b30;
    --on-fill: #15161a; --btn-edge: rgba(0, 0, 0, 0.55); --btn-shadow: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    padding-block: 32px 60px;
  }
  .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
  p.sub { color: var(--text-2); margin: 4px 0 0; font-size: 14px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 8px; align-items: center; }
  .group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  .lbl { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); }
  select, input {
    font-family: inherit; font-size: 14px;
    border: 1px solid var(--border-strong); border-radius: 6px;
    background: var(--panel); color: var(--text);
    padding: 8px 10px;
  }
  input#valueInput { width: 100px; font-family: var(--font-mono); }
  button {
    cursor: pointer; font-family: var(--font-mono); font-size: 13.5px; font-weight: 600;
    border: none; border-radius: 999px;
    padding: 9px 18px;
    color: var(--on-fill);
    box-shadow: 0 3px 0 var(--btn-edge), 0 4px 10px var(--btn-shadow);
    transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--btn-edge), 0 1px 3px var(--btn-shadow); }
  button:disabled, select:disabled, input:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button.b-add { background: var(--add); }
  button.b-remove { background: var(--remove); }
  button.b-peek { background: var(--peek); }
  button.b-query { background: var(--accent); }
  button.b-reset {
    font-family: var(--font-sans); font-weight: 500;
    background: var(--panel); color: var(--text);
    box-shadow: inset 0 0 0 1px var(--border-strong), 0 3px 0 var(--btn-edge), 0 4px 10px var(--btn-shadow);
  }
  button.b-reset:active:not(:disabled) { box-shadow: inset 0 0 0 1px var(--border-strong), 0 0 0 var(--btn-edge); }
  #inputError { color: var(--danger); font-size: 13px; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  @media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .panel-title { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); }
  .panel-meta { font-size: 12px; color: var(--muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Return value line: plain text, no shape */
  #floater { font-family: var(--font-mono); font-size: 15px; font-weight: 500; min-height: 24px; margin: 4px 0 0; padding-left: 4px; }
  #floater.c-add { color: var(--add); }
  #floater.c-remove { color: var(--remove); }
  #floater.c-peek { color: var(--peek); }
  #floater.c-query { color: var(--accent); }

  /* The set: a soft, slowly shifting bubble with values drifting inside */
  .bubble-wrap { position: relative; padding: 14px 8px 8px; }
  .bubble {
    position: relative; height: 320px; width: 100%;
    border-radius: 46% 54% 52% 48% / 55% 45% 55% 45%;
    background:
      radial-gradient(ellipse at 35% 35%, var(--bubble-a), transparent 65%),
      radial-gradient(ellipse at 70% 70%, var(--bubble-b), transparent 60%),
      radial-gradient(ellipse at 50% 50%, var(--bubble-b), transparent 75%);
    box-shadow: inset 0 0 0 1.5px var(--bubble-edge), inset 0 0 40px var(--bubble-a);
    animation: morph 14s ease-in-out infinite alternate;
  }
  @keyframes morph {
    0%   { border-radius: 46% 54% 52% 48% / 55% 45% 55% 45%; }
    50%  { border-radius: 54% 46% 44% 56% / 47% 55% 45% 53%; }
    100% { border-radius: 49% 51% 57% 43% / 52% 48% 52% 48%; }
  }
  .bubble.wobble { animation: morph 14s ease-in-out infinite alternate, wobble 0.45s; }
  @keyframes wobble { 30% { transform: scale(1.012, 0.99); } 65% { transform: scale(0.992, 1.01); } }
  .empty-note {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--muted); font-style: italic; font-size: 13px;
  }

  .item {
    position: absolute; transform: translate(-50%, -50%) scale(1);
    transition: transform 0.45s cubic-bezier(.3,1.4,.5,1), opacity 0.45s;
  }
  .item.enter { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
  .item.leave { transform: translate(-50%, -50%) scale(0.2); opacity: 0; transition: transform 0.5s ease-in, opacity 0.5s ease-in; }
  .orb {
    min-width: 54px; height: 54px; padding: 0 12px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: var(--orb); color: var(--text);
    border: 1.5px solid var(--border-strong);
    font-family: var(--font-mono); font-size: 15px; font-weight: 500; white-space: nowrap;
    box-shadow: 0 2px 8px var(--btn-shadow);
    animation: drift var(--dur, 5s) ease-in-out var(--delay, 0s) infinite alternate;
    transition: background 0.25s, border-color 0.25s, color 0.25s, box-shadow 0.25s;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(var(--dx, 2px), var(--dy, -4px)); }
    100% { transform: translate(calc(var(--dx, 2px) * -1), 2px); }
  }
  .item.hl-add .orb { background: var(--add-bg); border-color: var(--add); color: var(--add); box-shadow: 0 0 0 6px var(--add-bg); }
  .item.hl-remove .orb { background: var(--remove-bg); border-color: var(--remove); color: var(--remove); box-shadow: 0 0 0 6px var(--remove-bg); }
  .item.hl-peek .orb { background: var(--peek-bg); border-color: var(--peek); color: var(--peek); box-shadow: 0 0 0 6px var(--peek-bg); }
  .item.hl-query .orb { border-color: var(--accent); color: var(--accent); }
  .item.ghost .orb { border-style: dashed; border-color: var(--add); color: var(--add); background: transparent; box-shadow: none; animation: none; }

  .printout {
    margin-top: 10px; padding: 10px 12px; border-radius: 6px; background: var(--bg);
    font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere;
  }
  .printout .pcode { color: var(--text-2); }
  .printout .pout { color: var(--text); font-weight: 500; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* Call log */
  #log { display: flex; flex-direction: column; gap: 6px; max-height: 560px; overflow-y: auto; }
  .entry {
    display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 2px 8px;
    padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 13px;
  }
  .entry.latest { border-color: var(--border-strong); background: var(--bg); }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .code { overflow-wrap: anywhere; }
  .m-add { color: var(--add); } .m-remove { color: var(--remove); }
  .m-peek { color: var(--peek); } .m-query { color: var(--accent); }
  .ret, .snapshot, .note { grid-column: 2; overflow-wrap: anywhere; }
  .ret { color: var(--text-2); font-size: 12.5px; }
  .ret b { font-weight: 600; color: var(--text); }
  .note { color: var(--text-2); font-size: 12px; }
  .snapshot { color: var(--muted); font-size: 12px; }
  .log-empty { color: var(--muted); font-style: italic; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) {
    .bubble, .bubble.wobble, .orb { animation: none; }
    .item, .item.leave { transition-duration: 0.01s; }
  }
</style>

<div class="wrap">
  <header>
    <h1>Java Set Visualizer</h1>
    <p class="sub">Call add, remove, contains, isEmpty, and size on a Set. Each value is either in the set or it is not. Duplicates are never stored.</p>
  </header>

  <div class="controls">
    <div class="group">
      <label for="implSelect" class="lbl">Set</label>
      <select id="implSelect">
        <option value="HashSet">HashSet</option>
        <option value="TreeSet">TreeSet</option>
      </select>
      <label for="typeSelect" class="lbl">Type</label>
      <select id="typeSelect">
        <option value="Integer">Integer</option>
        <option value="String">String</option>
      </select>
    </div>
    <div class="divider"></div>
    <div class="group">
      <label for="valueInput" class="lbl">x =</label>
      <input id="valueInput" type="text" value="10" autocomplete="off">
      <button id="btnAdd" class="b-add" type="button">add(x)</button>
      <button id="btnRemove" class="b-remove" type="button">remove(x)</button>
      <button id="btnContains" class="b-peek" type="button">contains(x)</button>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button id="btnEmpty" class="b-query" type="button">isEmpty()</button>
      <button id="btnSize" class="b-query" type="button">size()</button>
    </div>
    <div class="divider"></div>
    <button id="btnReset" class="b-reset" type="button">Reset</button>
    <span id="inputError" hidden></span>
  </div>

  <div class="main">
    <section class="panel" aria-label="Set contents">
      <div class="panel-head">
        <span class="panel-title" id="declLabel">Set&lt;Integer&gt; s = new HashSet&lt;&gt;();</span>
        <span class="panel-meta" id="sizeLabel">size 0</span>
      </div>
      <div id="floater" aria-live="polite"></div>
      <div class="bubble-wrap">
        <div class="bubble" id="bubble">
          <div class="empty-note" id="emptyNote">(empty)</div>
        </div>
      </div>
      <div class="printout">
        <span class="pcode">System.out.println(s);</span><br>
        <span class="pout" id="printOut">[]</span>
      </div>
      <div class="key" id="keyText"></div>
    </section>

    <section class="panel" aria-label="Call history">
      <div class="panel-head">
        <span class="panel-title">Calls (newest first)</span>
        <span class="panel-meta" id="callCount">0 calls</span>
      </div>
      <div id="log"></div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const bubble = $("bubble"), floater = $("floater"), logEl = $("log");
const controls = ["btnAdd", "btnRemove", "btnContains", "btnEmpty", "btnSize", "btnReset", "typeSelect", "implSelect", "valueInput"].map($);
const STRING_SUGGEST = ["red", "green", "blue", "cyan", "gold", "plum", "teal", "rose", "lime", "navy", "pink", "sand"];

let type = "Integer";
let impl = "HashSet";
let items = [];      // [{ val, raw, seq, el, x, y }]  x, y are % of the bubble
let seq = 0;
let capacity = 16;   // tracked only so the printed HashSet order matches real Java
let log = [];
let busy = false;
let suggestIdx = 0;

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const reflow = (el) => void el.offsetWidth;
function setBusy(b) { busy = b; controls.forEach(el => el.disabled = b); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* ---------- printed order (computed silently, never drawn) ---------- */
function javaHash(raw) {
  let h;
  if (type === "Integer") h = Number(raw) | 0;
  else { h = 0; for (let i = 0; i < raw.length; i++) h = (Math.imul(31, h) + raw.charCodeAt(i)) | 0; }
  return (h ^ (h >>> 16)) | 0;
}
function compareRaw(a, b) {
  if (type === "Integer") return Number(a) - Number(b);
  return a < b ? -1 : a > b ? 1 : 0;
}
function iterOrder() {
  const copy = items.slice();
  if (impl === "TreeSet") return copy.sort((a, b) => compareRaw(a.raw, b.raw));
  return copy.sort((a, b) => ((javaHash(a.raw) & (capacity - 1)) - (javaHash(b.raw) & (capacity - 1))) || (a.seq - b.seq));
}
function showStr() { return "[" + iterOrder().map(n => n.val).join(", ") + "]"; }

/* ---------- placement: a free spot somewhere inside the bubble ---------- */
function findSpot() {
  const w = bubble.clientWidth || 600, h = bubble.clientHeight || 320;
  let minGap = 74;
  for (let round = 0; round < 6; round++) {
    for (let tries = 0; tries < 120; tries++) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 0.78;
      const x = 50 + Math.cos(a) * r * 42, y = 50 + Math.sin(a) * r * 38;
      const px = x / 100 * w, py = y / 100 * h;
      const clear = items.every(it => Math.hypot(it.x / 100 * w - px, it.y / 100 * h - py) >= minGap);
      if (clear) return { x, y };
    }
    minGap *= 0.85;
  }
  return { x: 50 + (Math.random() - 0.5) * 60, y: 50 + (Math.random() - 0.5) * 50 };
}
function makeItem(val, spot) {
  const el = document.createElement("div");
  el.className = "item enter";
  el.innerHTML = `<div class="orb"></div>`;
  const orb = el.firstChild;
  orb.textContent = val;
  orb.style.setProperty("--dur", (4 + Math.random() * 3).toFixed(2) + "s");
  orb.style.setProperty("--delay", (-Math.random() * 5).toFixed(2) + "s");
  orb.style.setProperty("--dx", ((Math.random() - 0.5) * 8).toFixed(1) + "px");
  orb.style.setProperty("--dy", (-2 - Math.random() * 4).toFixed(1) + "px");
  el.style.left = spot.x + "%";
  el.style.top = spot.y + "%";
  el.title = val;
  bubble.appendChild(el);
  return el;
}

function refresh() {
  $("emptyNote").hidden = items.length > 0;
  $("sizeLabel").textContent = "size " + items.length;
  $("printOut").textContent = showStr();
}
function renderKey() {
  $("keyText").innerHTML = impl === "HashSet"
    ? `<span>A Set holds each value at most once. It has no indexes and no front or back. A HashSet also makes no promise about the order it prints in.</span>`
    : `<span>A Set holds each value at most once. It has no indexes and no front or back. A TreeSet always prints its values from smallest to largest.</span>`;
}

function say(text, cls) { floater.className = cls ? "c-" + cls : ""; floater.textContent = text; }
function clearHighlights() {
  say("", "");
  bubble.querySelectorAll(".item").forEach(c => c.classList.remove("hl-add", "hl-remove", "hl-peek", "hl-query"));
}
async function beat() { clearHighlights(); await sleep(180); }
function wobble() { bubble.classList.remove("wobble"); reflow(bubble); bubble.classList.add("wobble"); }
const find = (raw) => items.find(it => it.raw === raw);

/* ---------- log ---------- */
function renderLog() {
  $("callCount").textContent = log.length + (log.length === 1 ? " call" : " calls");
  if (log.length === 0) { logEl.innerHTML = '<div class="log-empty">No calls yet.</div>'; return; }
  logEl.innerHTML = log.map((e, i) => ({ e, i })).reverse().map(({ e, i }) => `
    <div class="entry${i === log.length - 1 ? " latest" : ""}">
      <span class="num">${i + 1}</span>
      <span class="code">s.<span class="m-${e.kind}">${esc(e.method)}</span>(${esc(e.args || "")});</span>
      <span class="ret">returns <b>${esc(e.returns)}</b></span>
      ${e.note ? `<span class="note">${esc(e.note)}</span>` : ""}
      <span class="snapshot">s is now ${esc(e.after)}</span>
    </div>`).join("");
  logEl.scrollTop = 0;
}
function addLog(entry) { entry.after = showStr(); log.push(entry); renderLog(); }

/* ---------- input ---------- */
function readValue() {
  const s = $("valueInput").value.trim();
  if (type === "Integer") {
    if (!/^-?\d+$/.test(s)) return { error: "Enter a whole number for x." };
    const n = Number(s);
    if (n > 2147483647 || n < -2147483648) return { error: "x is outside the int range." };
    return { raw: String(n), val: String(n) };
  }
  const raw = s.replace(/^"(.*)"$/, "$1");
  if (raw === "") return { error: "Enter some text for x." };
  return { raw, val: "\"" + raw + "\"" };
}
function showInputError(msg) { const e = $("inputError"); e.textContent = msg; e.hidden = !msg; }
function advanceSuggestion() {
  $("valueInput").value = type === "Integer"
    ? String((suggestIdx + 1) * 10)
    : STRING_SUGGEST[suggestIdx % STRING_SUGGEST.length];
  suggestIdx++;
}

/* ---------- operations ---------- */
async function doAdd() {
  const v = readValue(); if (v.error) return showInputError(v.error);
  showInputError("");
  setBusy(true);
  await beat();
  const existing = find(v.raw);
  if (existing) {
    // a dashed copy appears beside the one already there, then dissolves
    existing.el.classList.add("hl-add");
    const ghostSpot = { x: Math.min(existing.x + 9, 92), y: Math.max(existing.y - 12, 8) };
    const ghost = makeItem(v.val, ghostSpot);
    ghost.classList.add("ghost");
    reflow(ghost);
    ghost.classList.remove("enter");
    await sleep(550);
    ghost.classList.add("leave");
    say("returns false", "add");
    await sleep(500);
    ghost.remove();
    addLog({ kind: "add", method: "add", args: v.val, returns: "false", note: `${v.val} is already in the set, so nothing changed` });
    setBusy(false); return;
  }
  const spot = findSpot();
  const el = makeItem(v.val, spot);
  el.classList.add("hl-add");
  items.push({ val: v.val, raw: v.raw, seq: seq++, el, x: spot.x, y: spot.y });
  if (items.length > capacity * 0.75) capacity *= 2;
  reflow(el);
  el.classList.remove("enter");
  refresh();
  await sleep(450);
  say("returns true", "add");
  addLog({ kind: "add", method: "add", args: v.val, returns: "true" });
  advanceSuggestion();
  setBusy(false);
}

async function doRemove() {
  const v = readValue(); if (v.error) return showInputError(v.error);
  showInputError("");
  setBusy(true);
  await beat();
  const it = find(v.raw);
  if (!it) {
    wobble();
    say("returns false", "remove");
    addLog({ kind: "remove", method: "remove", args: v.val, returns: "false", note: `${v.val} was not in the set` });
    await sleep(350);
    setBusy(false); return;
  }
  it.el.classList.add("hl-remove");
  await sleep(380);
  it.el.classList.add("leave");
  say("returns true", "remove");
  await sleep(500);
  it.el.remove();
  items.splice(items.indexOf(it), 1);
  refresh();
  addLog({ kind: "remove", method: "remove", args: v.val, returns: "true" });
  setBusy(false);
}

async function doContains() {
  const v = readValue(); if (v.error) return showInputError(v.error);
  showInputError("");
  setBusy(true);
  await beat();
  const it = find(v.raw);
  if (it) it.el.classList.add("hl-peek");
  else wobble();
  say("returns " + !!it, "peek");
  addLog({ kind: "peek", method: "contains", args: v.val, returns: String(!!it) });
  await sleep(300);
  setBusy(false);
}

async function doQuery(method) {
  setBusy(true);
  await beat();
  const n = items.length;
  const result = method === "isEmpty" ? String(n === 0) : String(n);
  items.forEach(it => it.el.classList.add("hl-query"));
  say("returns " + result, "query");
  addLog({ kind: "query", method, returns: result });
  await sleep(250);
  setBusy(false);
}

function doReset() {
  $("declLabel").textContent = `Set<${type}> s = new ${impl}<>();`;
  bubble.querySelectorAll(".item").forEach(el => el.remove());
  items = []; log = []; seq = 0; suggestIdx = 0; capacity = 16;
  clearHighlights();
  refresh();
  renderKey();
  renderLog();
  advanceSuggestion();
  showInputError("");
}

const guard = (fn) => () => { if (!busy) fn(); };
$("btnAdd").addEventListener("click", guard(doAdd));
$("valueInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !busy) doAdd(); });
$("btnRemove").addEventListener("click", guard(doRemove));
$("btnContains").addEventListener("click", guard(doContains));
$("btnEmpty").addEventListener("click", guard(() => doQuery("isEmpty")));
$("btnSize").addEventListener("click", guard(() => doQuery("size")));
$("btnReset").addEventListener("click", guard(doReset));
$("typeSelect").addEventListener("change", (e) => { type = e.target.value; doReset(); });
$("implSelect").addEventListener("change", (e) => { impl = e.target.value; doReset(); });

doReset();
</script>

</body></html>
